<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Athletic OS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one-thumb phone app; summary at top of each tab, actions in cards, fixed bottom tab bar. Single dark theme by choice. */
:root{
  --bg:#000000;
  --s1:#0c0c0d;
  --s2:#161618;
  --line:#26262a;
  --t1:#f4f4f5;
  --t2:#a1a1a8;
  --t3:#62626a;
  --ok:#cfe9d6;
  --warn:#e9d9b8;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--t1);font-family:var(--body);font-size:16px;line-height:1.4}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--t1);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 110px);display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:34px;line-height:1;text-transform:uppercase}
h2{font-size:21px;text-transform:uppercase;letter-spacing:.04em}
h3{font-size:18px;font-weight:600}
.num,.big{font-family:var(--display);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--t2);font-weight:600}
.muted{color:var(--t2)}.dim{color:var(--t3)}
.small{font-size:13px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-top:4px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.card.hi{background:var(--t1);color:#000;border-color:var(--t1)}
.card.hi .muted,.card.hi .eyebrow{color:#45454b}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btn{white-space:nowrap;border:1px solid var(--line);background:var(--s2);border-radius:12px;padding:12px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
.btn.pri{background:var(--t1);color:#000;border-color:var(--t1)}
.card.hi .btn.pri{background:#000;color:#fff;border-color:#000}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:7px 11px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.4}
.icon{width:20px;height:20px;flex:none}
.tile{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .big{font-size:28px;line-height:1;font-weight:600}
.tile .lbl{font-size:12px;color:var(--t2);text-transform:uppercase;letter-spacing:.08em}
.chip{border:1px solid var(--line);background:var(--s2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--t1);color:#000;border-color:var(--t1)}
.pill{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:999px;border:1px solid var(--line);color:var(--t2)}
.pill.ok{color:#000;background:var(--ok);border-color:var(--ok)}
.pill.warn{color:#000;background:var(--warn);border-color:var(--warn)}
.bar{height:8px;background:var(--s2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--t1);border-radius:99px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;overflow-wrap:anywhere}
.x{border:0;background:transparent;color:var(--t3);width:34px;height:34px;border-radius:8px;display:grid;place-items:center}
.check{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--t3);display:grid;place-items:center;flex:none;background:transparent}
.check.on{background:var(--t1);border-color:var(--t1);color:#000}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--t2);font-weight:600}
input[type=number],input[type=text],input[type=search],input[type=date],textarea,select{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-height:44px;color:var(--t1)}
textarea{min-height:90px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--t3)}
.ring{position:relative;display:grid;place-items:center;flex:none}
.ring .c{position:absolute;text-align:center;line-height:1}
.ring .c b{font-family:var(--display);font-size:30px;font-weight:600;display:block}
.ring .c span{font-size:11px;color:var(--t2);letter-spacing:.08em;text-transform:uppercase}
.step{display:flex;align-items:center;gap:8px}
.step .v{min-width:64px;text-align:center;font-family:var(--display);font-size:26px;font-weight:600}
.step button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--s2);font-size:22px;font-weight:600}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(0,0,0,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom) + 8px)}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;color:var(--t3);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
nav.tabs button.on{color:var(--t1)}
/* sheet */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:40;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;display:none;max-height:88%;overflow:auto;background:var(--s1);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 20px)}
#sheet .in{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
#sheet .grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 4px}
body.sheet #scrim,body.sheet #sheet{display:block}
body.sheet{overflow:hidden}
/* rest timer */
#rest{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 70px);z-index:30;display:none;padding:0 16px}
#rest .in{max-width:480px;margin:0 auto;background:var(--t1);color:#000;border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
#rest .tm{font-family:var(--display);font-size:32px;font-weight:700;min-width:76px;font-variant-numeric:tabular-nums}
#rest button{background:#000;color:#fff;border:0;border-radius:10px;padding:8px 10px;font-weight:600;font-size:14px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);z-index:60;background:var(--t1);color:#000;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;display:none;max-width:90%}
/* workout */
.set{display:grid;grid-template-columns:34px 1fr 1fr 46px;gap:8px;align-items:center}
.set .n{font-family:var(--display);font-size:20px;color:var(--t2);text-align:center}
.set input{text-align:center;font-family:var(--display);font-size:20px;padding:6px}
.set .ok{width:46px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--s2);display:grid;place-items:center}
.set .ok.on{background:var(--t1);color:#000;border-color:var(--t1)}
.set.hd{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;text-align:center}
.cue{font-size:14px;color:var(--t2)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photos figure{margin:0;position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--s2);border:1px solid var(--line)}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos figcaption{position:absolute;left:6px;bottom:6px;font-size:11px;background:rgba(0,0,0,.7);padding:2px 6px;border-radius:6px}
.scroll-x{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.week .d{border:1px solid var(--line);border-radius:10px;padding:8px 2px;text-align:center;background:var(--s2);display:flex;flex-direction:column;gap:2px;font-size:11px}
.week .d b{font-family:var(--display);font-size:15px}
.week .d.today{border-color:var(--t1)}
.week .d.done{background:var(--t1);color:#000}
.sync{font-size:12px;color:var(--t3)}
.spin{width:16px;height:16px;border:2px solid var(--t3);border-top-color:var(--t1);border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
input[type=search]{-webkit-appearance:none;appearance:none}
.food-it{display:grid;grid-template-columns:1fr 62px 62px 52px;gap:6px;align-items:center}
.food-it input{padding:8px;min-height:38px;font-size:14px}
hr{border:0;border-top:1px solid var(--line);margin:0;width:100%}
</style>
</head>
<body>
<main id="app"></main>
<div id="rest"><div class="in"><div class="tm" id="restTm">1:30</div><div style="flex:1;font-weight:600;font-size:14px">Recupero</div><button data-act="restAdd" data-v="-15">−15</button><button data-act="restAdd" data-v="15">+15</button><button data-act="restStop">Salta</button></div></div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div id="scrim" data-act="closeSheet"></div>
<div id="sheet"><div class="in" id="sheetIn"></div></div>
<div id="toast"></div>

<script>
"use strict";
/* ---------- utils ---------- */
const cap = n => (window.claude&&typeof window.claude.use==="function") ? window.claude.use(n).catch(()=>null) : Promise.resolve(null);
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,"0");
const dk = (d=new Date()) => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseDk = k => { const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (k,n) => { const d=parseDk(k); d.setDate(d.getDate()+n); return dk(d); };
const uid = () => Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (n,d=0) => (n==null||isNaN(n))?"–":Number(n).toLocaleString("it-IT",{minimumFractionDigits:d,maximumFractionDigits:d});
const r5 = n => Math.round(n/5)*5;
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const GIORNI = ["Lun","Mar","Mer","Gio","Ven","Sab","Dom"];
const wdIdx = (d=new Date()) => (d.getDay()+6)%7;
const dateLong = d => d.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});
const dateShort = k => parseDk(k).toLocaleDateString("it-IT",{day:"numeric",month:"short"});

const IC = {
  today:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  train:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12"/></svg>',
  food:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-2 1-3 4-3 7v3h3"/></svg>',
  prog:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>',
  me:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>',
  cam:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  mic:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  star:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>',
  redo:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"/></svg>',
  plus:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  tick:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
  x:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  spark:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>'
};

/* ---------- training program ---------- */
// level: [name, cue, kg, [min,max], unit]
const EX = {
  push:{m:"Petto · Tricipiti",rr:[8,15],rest:75,lv:[
    ["Push-up inclinato alto","Mani su tavolo o bancone, corpo dritto come una tavola. Scendi finché il petto sfiora il bordo.",0],
    ["Push-up inclinato basso","Mani su sedia o gradino. Gomiti a 45° dal busto, mai aperti a T.",0],
    ["Push-up","A terra. Glutei e addome contratti, petto a 5 cm dal pavimento, spingi forte.",0],
    ["Push-up piedi rialzati","Piedi su una sedia: più lavoro su spalle e petto alto.",0],
    ["Push-up arciere","Un braccio lavora, l'altro resta disteso di lato. Le ripetizioni sono per lato.",0]]},
  squat:{m:"Quadricipiti · Glutei",rr:[10,15],rest:75,lv:[
    ["Squat a corpo libero","Piedi larghezza spalle, scendi sotto il parallelo con il petto alto.",0],
    ["Goblet squat 5 kg lento","Manubrio al petto, 3 secondi in discesa e 1 secondo fermo in basso.",5],
    ["Squat con salto","Discesa controllata, salto esplosivo, atterraggio morbido. Utile per il basket.",0,[8,12]],
    ["Pistol squat assistito","Su una gamba, tieniti a un palo o alla porta. Ripetizioni per lato.",0,[5,10]]]},
  rowdb:{m:"Dorso · Bicipiti",rr:[12,20],rest:60,lv:[
    ["Rematore 1 braccio 5 kg","Mano e ginocchio su sedia o divano. Tira il gomito verso l'anca: 1 s su, 3 s giù. Ripetizioni per lato.",5],
    ["Rematore con pausa 5 kg","Fermo 2 secondi in alto stringendo la scapola. Ripetizioni per lato.",5],
    ["Rematore inverso sotto il tavolo","Sdraiato sotto un tavolo robusto, tira il petto verso il bordo.",0,[8,15]]]},
  bridge:{m:"Glutei · Femorali",rr:[12,20],rest:60,lv:[
    ["Ponte glutei","Talloni vicini ai glutei, spingi il bacino in alto e stringi 1 secondo.",0],
    ["Ponte glutei con 5 kg","Manubrio appoggiato sul bacino, pausa 2 s in alto.",5],
    ["Hip thrust a una gamba","Spalle sul divano, una gamba sola. Ripetizioni per lato.",0,[8,15]]]},
  lateral:{m:"Spalle",rr:[12,20],rest:45,lv:[
    ["Alzate laterali 5 kg","Gomiti morbidi, sali fino all'altezza delle spalle senza slancio.",5],
    ["Alzate laterali lente 5 kg","3 secondi su, 3 secondi giù. Brucia, è normale.",5]]},
  plank:{m:"Core",rr:[30,60],unit:"sec",rest:45,lv:[
    ["Plank","Gomiti sotto le spalle, glutei stretti, non far cadere il bacino.",0],
    ["Plank laterale","Tempo per lato. Bacino alto, corpo in linea.",0,[20,45]],
    ["Plank RKC","Stringi tutto al massimo: gomiti tirati verso i piedi. Più duro, più breve.",0,[15,30]]]},
  pull:{m:"Dorso · Bicipiti",rr:[3,8],rest:120,lv:[
    ["Appeso alla sbarra","Braccia tese, spalle lontane dalle orecchie. Allena presa e scapole.",0,[20,45],"sec"],
    ["Trazioni negative","Sali con un salto, scendi in 5 secondi fino a braccia tese.",0,[3,6]],
    ["Trazioni con salto + negativa","Spinta delle gambe per salire, discesa lenta in 3 secondi.",0,[5,8]],
    ["Trazioni","Mento sopra la sbarra, discesa completa, niente slancio.",0,[3,8]],
    ["Trazioni con 5 kg","Manubrio stretto tra i piedi.",5,[5,10]]]},
  dip:{m:"Petto · Tricipiti",rr:[8,15],rest:90,lv:[
    ["Dip su panchina","Mani sul bordo della panca, gambe piegate, scendi a 90°.",0],
    ["Dip negative alle parallele","Sali col salto, scendi in 4 secondi.",0,[3,6]],
    ["Dip alle parallele","Spalle basse, scendi finché il gomito arriva a 90°.",0,[5,12]]]},
  aus:{m:"Dorso alto",rr:[8,15],rest:75,lv:[
    ["Australian row sbarra alta","Corpo inclinato a circa 45°, tira il petto verso la sbarra.",0],
    ["Australian row sbarra bassa","Corpo quasi orizzontale, pausa 1 s in alto.",0],
    ["Australian row piedi rialzati","Piedi su una panca: corpo parallelo al suolo.",0]]},
  lunge:{m:"Gambe",rr:[8,12],rest:75,lv:[
    ["Affondi indietro","Ginocchio dietro sfiora il suolo, busto dritto. Ripetizioni per lato.",0],
    ["Affondi camminati 2×5 kg","Un manubrio per mano, passi lunghi. Ripetizioni per lato.",5],
    ["Step-up su panca 2×5 kg","Sali spingendo solo con la gamba davanti. Ripetizioni per lato.",5]]},
  knees:{m:"Addome",rr:[8,15],rest:60,lv:[
    ["Ginocchia al petto alle parallele","Appoggiato sulle braccia, porta le ginocchia al petto senza oscillare.",0],
    ["Ginocchia al petto appeso","Appeso alla sbarra, spalle attive.",0],
    ["Leg raise appeso","Gambe tese fino a 90°.",0,[6,12]]]},
  pike:{m:"Spalle · Tricipiti",rr:[6,12],rest:90,lv:[
    ["Pike push-up","Bacino alto a V, porta la testa verso il pavimento davanti alle mani.",0],
    ["Pike push-up piedi rialzati","Piedi su una sedia, più carico sulle spalle.",0],
    ["Verticale al muro","Tenuta a braccia tese con la pancia verso il muro.",0,[20,40],"sec"]]},
  split:{m:"Quadricipiti · Glutei",rr:[8,12],rest:75,lv:[
    ["Split squat","Posizione da affondo fissa, scendi e sali. Ripetizioni per lato.",0],
    ["Split squat bulgaro","Piede dietro appoggiato su una sedia. Ripetizioni per lato.",0],
    ["Bulgaro 2×5 kg","Un manubrio per mano. Ripetizioni per lato.",5],
    ["Bulgaro 2×5 kg lento","3 secondi in discesa. Ripetizioni per lato.",5]]},
  rdl:{m:"Femorali · Glutei",rr:[12,20],rest:60,lv:[
    ["Stacco rumeno 2×5 kg","Spingi il bacino indietro, schiena neutra, manubri vicini alle gambe.",5],
    ["Stacco rumeno a una gamba 5 kg","Equilibrio e femorali. Ripetizioni per lato.",5,[8,12]]]},
  pushc:{m:"Tricipiti · Petto",rr:[8,15],rest:60,lv:[
    ["Push-up stretti inclinati","Mani vicine su un rialzo, gomiti lungo i fianchi.",0],

/* ---------- nutrition targets ---------- */
function targets(){
  const p=S.core.profile, w=currentWeight();
  const bmr = 10*w + 6.25*p.height - 5*p.age + (p.sex==="F"?-161:5);
  const gym = p.week.filter(x=>x.includes("pesi")).length;
  const factor = 1.3 + 0.06*Math.min(p.basket,6) + 0.03*gym;
  const tdee = bmr*factor;
  const deficit = p.pace*7700/7;
  let kcal = r5((tdee - deficit + (p.kcalAdj||0))/10)*10;
  kcal = Math.max(kcal, Math.round(bmr*1.1/50)*50, p.sex==="F"?1500:1800);
  if(p.kcalOverride) kcal=+p.kcalOverride;
  const prot = p.protOverride? +p.protOverride : r5(1.8*w);
  const fat = Math.round(kcal*0.27/9);
  const carb = Math.max(0,Math.round((kcal - prot*4 - fat*9)/4));
  return {kcal,prot,fat,carb,bmr:Math.round(bmr),tdee:Math.round(tdee)};
}

function isActiveDay(k){
  const d=peekDay(k); const wk=allWorkouts().some(w=>w.d===k); const wt=S.core.weights.some(w=>w.d===k);
  if(wk||wt) return true; if(!d) return false;
  return d.meals.length>0 || d.basket || Object.values(d.habits).filter(Boolean).length>=2;
}
function streak(){
  let k=dk(); if(!isActiveDay(k)) k=addDays(k,-1);
  let n=0; while(isActiveDay(k) && n<999){ n++; k=addDays(k,-1); }
  return n;
}
function nextWorkout(){

  const last=w[w.length-1].day; return {A:"B",B:"C",C:"A"}[last]||"A";
}
function lastSetsFor(id){

}
function readyToLevelUp(id){
  const last=lastSetsFor(id); if(!last||last.lv!==lvOf(id)) return false;
  const info=lvInfo(id); if(info.max-1<=lvOf(id)) return false;
  return last.sets.length>=3 && last.sets.every(s=>(+s.r||0)>=info.rr[1]);
}
function avgRange(fromK,toK){ const v=S.core.weights.filter(w=>w.d>=fromK&&w.d<=toK).map(w=>w.kg); return v.length? v.reduce((a,b)=>a+b,0)/v.length : null; }
function coach(){
  const t=dk(); const a1=avgRange(addDays(t,-6),t), a0=avgRange(addDays(t,-13),addDays(t,-7));
  const p=S.core.profile;
  if(S.core.weights.length<2) return {msg:"Pesati 3–4 mattine a settimana, a digiuno e dopo il bagno. Conta la media settimanale, non il singolo giorno."};
  if(a1==null||a0==null) return {msg:"Continua a pesarti: con due settimane di dati ti dico se il ritmo è giusto e se serve ritoccare le calorie."};
  const rate=a1-a0;
  const txt=`Media ultimi 7 giorni ${fmt(a1,1)} kg (${rate<=0?"−":"+"}${fmt(Math.abs(rate),1)} kg rispetto alla settimana prima).`;
  if(rate>-0.2 && (p.kcalAdj||0)>-450) return {msg:txt+" Stai scendendo più piano dell'obiettivo: togli 150 kcal al giorno.",act:-150,state:"warn"};
  if(rate<-1.0) return {msg:txt+" Stai scendendo troppo in fretta e rischi di perdere muscolo: aggiungi 150 kcal.",act:150,state:"warn"};
  return {msg:txt+" Ritmo giusto, non cambiare niente.",state:"ok"};
}

/* ---------- progress view ---------- */
function lineChart(pts,avg,goal){
  const W=360,H=170,pl=34,pr=10,pt=10,pb=22;
  if(pts.length<2) return `<p class="small muted" style="margin:0">Il grafico compare dalla seconda pesata.</p>`;
  const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y).concat(goal&&goal>Math.min(...pts.map(p=>p.y))-3?[goal]:[]);
  let y0=Math.floor(Math.min(...ys)-0.5), y1=Math.ceil(Math.max(...ys)+0.5);
  const x0=Math.min(...xs), x1=Math.max(...xs)||x0+1;
  const X=x=>pl+(x-x0)/((x1-x0)||1)*(W-pl-pr), Y=y=>pt+(1-(y-y0)/((y1-y0)||1))*(H-pt-pb);
  const step=Math.max(1,Math.ceil((y1-y0)/4));
  let g="";
  for(let v=y0; v<=y1; v+=step){ g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--t3)">${v}</text>`; }
  if(goal&&goal>=y0&&goal<=y1) g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="var(--t2)" stroke-dasharray="4 4"/><text x="${W-pr}" y="${Y(goal)-5}" text-anchor="end" font-size="11" fill="var(--t2)">obiettivo ${goal}</text>`;
  const path=pts.map((p,i)=>(i?"L":"M")+X(p.x).toFixed(1)+" "+Y(p.y).toFixed(1)).join(" ");
  const apath=avg.map((p,i)=>(i?"L":"M")+X(p.x).toFixed(1)+" "+Y(p.y).toFixed(1)).join(" ");
  const area=apath+` L${X(avg[avg.length-1].x).toFixed(1)} ${H-pb} L${X(avg[0].x).toFixed(1)} ${H-pb} Z`;
  const lp=pts[pts.length-1];
  const dl=d=>new Date(d).toLocaleDateString("it-IT",{day:"numeric",month:"short"});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Andamento del peso">
  <defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
  ${g}<path d="${area}" fill="url(#ga)"/><path d="${path}" fill="none" stroke="var(--t3)" stroke-width="1.2"/>
  ${pts.map(p=>`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="2" fill="var(--t3)"/>`).join("")}
  <path d="${apath}" fill="none" stroke="var(--t1)" stroke-width="2.4" stroke-linejoin="round"/>
  <circle cx="${X(lp.x)}" cy="${Y(avg[avg.length-1].y)}" r="4.5" fill="var(--t1)"/>
  <text x="${pl}" y="${H-5}" font-size="11" fill="var(--t3)">${dl(x0)}</text><text x="${W-pr}" y="${H-5}" text-anchor="end" font-size="11" fill="var(--t3)">${dl(x1)}</text></svg>`;
}

  </div>
  <div class="card"><div class="row between"><div class="eyebrow">Misure (cm)</div><button class="btn sm" data-act="measSheet">${IC.plus} Misura</button></div>
    ${mLast?`<div class="grid4">${[["vita","Vita"],["petto","Petto"],["braccio","Braccio"],["coscia","Coscia"]].map(([k,l])=>`<div class="tile"><span class="lbl">${l}</span><span class="big" style="font-size:22px">${mLast[k]?fmt(mLast[k],1):"–"}</span>${md(k)}</div>`).join("")}</div><p class="small dim" style="margin:0">Se la vita scende e braccio e petto restano uguali o salgono, stai perdendo grasso e mettendo muscolo, anche quando la bilancia è ferma.</p>`

    <div class="tile"><span class="lbl">Livelli saliti</span><span class="big">${lvSum}</span><span class="small muted">su ${Object.keys(EX).length} esercizi</span></div>

/* ---------- images ---------- */
function shrink(file,max,q){
  return new Promise((res,rej)=>{ const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{ const s=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); c.toBlob(b=>b?res({blob:b,url:c.toDataURL("image/jpeg",q)}):rej(),"image/jpeg",q); };
    img.onerror=()=>{URL.revokeObjectURL(url);rej();}; img.src=url; });
}

let DICT=null, dictOn=false;

/* ---------- rest timer ---------- */
let REST={end:0,iv:null}, AC=null;
function startRest(sec){
  try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume(); }catch(e){}
  REST.end=Date.now()+sec*1000; $("#rest").style.display="block"; tickRest();
  clearInterval(REST.iv); REST.iv=setInterval(tickRest,250);
}
function tickRest(){
  const left=Math.max(0,Math.ceil((REST.end-Date.now())/1000));
  $("#restTm").textContent=Math.floor(left/60)+":"+pad(left%60);
  if(left<=0){ stopRest(); beep(); }
}
function stopRest(){ clearInterval(REST.iv); $("#rest").style.display="none"; }
function beep(){
  try{ navigator.vibrate&&navigator.vibrate([200,100,200]); }catch(e){}
  try{ if(!AC) return; [0,0.25].forEach(o=>{ const os=AC.createOscillator(), g=AC.createGain(); os.frequency.value=880; g.gain.setValueAtTime(0.25,AC.currentTime+o); g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+o+0.2); os.connect(g).connect(AC.destination); os.start(AC.currentTime+o); os.stop(AC.currentTime+o+0.22); }); }catch(e){}
}

/* ---------- workout actions ---------- */
function startWorkout(L){
  const ex={};
  DAYS[L].ex.forEach(id=>{ const i=lvInfo(id); ex[id]=[0,1,2].map(()=>({r:"",kg:i.kg||"",done:false})); });
  S.core.active={day:L,t:Date.now(),ex}; touch("core"); UI.tab="allena"; location.hash="allena"; render(); window.scrollTo(0,0);
}
function finishWorkout(){
  const a=S.core.active; const rec={id:uid(),d:dk(),t:Date.now(),day:a.day,dur:Math.max(1,Math.round((Date.now()-a.t)/60000)),ex:{},n:0};
  for(const id in a.ex){ const sets=a.ex[id].filter(s=>s.done||s.r!=="").map(s=>({r:+s.r||0,kg:+s.kg||0})).filter(s=>s.r>0); if(sets.length){ rec.ex[id]={lv:lvOf(id),sets}; rec.n+=sets.length; } }
  if(!rec.n){ toast("Nessuna serie registrata"); return; }
  getM(rec.d).workouts.push(rec); S.core.active=null; touchDay(rec.d); touch("core"); stopRest(); render(); window.scrollTo(0,0);
  const ups=Object.keys(rec.ex).filter(readyToLevelUp);
  toast(ups.length?`Salvato. ${ups.length} esercizi pronti per il livello successivo`:"Allenamento salvato");
}

    },
    favSheet(){ favSheet(); },
    addFav(){ const f=S.core.favs.find(x=>x.id===v); if(f){ addMealFrom(f,$("#slotSel").value); closeSheet(); render(); toast("Aggiunto: "+f.name.slice(0,30)); } },
    delFav(){ S.core.favs=S.core.favs.filter(x=>x.id!==v); touch("core"); favSheet(); },
    yestSheet(){ yestSheet(); },
    addY(){ const y=peekDay(addDays(k,-1)); const m=y&&y.meals.find(x=>x.id===v); if(m){ addMealFrom(m,m.slot); el.disabled=true; el.innerHTML=IC.tick; render(); } },
    addAllY(){ const y=peekDay(addDays(k,-1)); (y?y.meals:[]).forEach(m=>addMealFrom(m,m.slot)); closeSheet(); render(); toast("Pasti di ieri aggiunti"); },
    manSheet(){ manSheet(); },
    manAdd(){ const name=$("#mn").value.trim()||"Pasto"; const kc=+$("#mk").value; if(!kc){ toast("Inserisci almeno le calorie"); return; }
      const src={name,kcal:kc,p:+$("#mp").value||0,c:+$("#mc").value||0,f:+$("#mf").value||0}; addMealFrom(src,$("#slotSel").value);
      if($("#mfav").checked){ S.core.favs.unshift({...src,id:uid()}); touch("core"); } closeSheet(); render(); toast("Pasto aggiunto"); },
    delMeal(){ const d=day(k); d.meals=d.meals.filter(m=>m.id!==v); touchDay(k); AI_IDEAS=null; render(); },
    aiIdeas(){ aiIdeas(); },
    addIdea(){ const t=targets(), tot=totals(day()); const list=AI_IDEAS||S.core.favs.filter(f=>f.kcal<=Math.max(250,t.kcal-tot.kcal+80)).sort((a,b)=>(b.p/b.kcal)-(a.p/a.kcal)).slice(0,3); const f=list[+v]; if(f){ addMealFrom(f,slotNow()); render(); toast("Pasto aggiunto"); } },
    range(){ UI.progRange=+v; render(); },
    measSheet(){ measSheet(); },
    measAdd(){ const m={d:k}; let any=false; ["vita","petto","braccio","coscia"].forEach(x=>{ const n=+$("#ms_"+x).value; if(n){m[x]=n;any=true;} }); if(!any){toast("Inserisci almeno una misura");return;}
      S.core.measures=S.core.measures.filter(x=>x.d!==k); S.core.measures.push(m); touch("core"); closeSheet(); render(); toast("Misure salvate"); },
    delPhoto(){ UI.delP=v; confirmSheet("Eliminare la foto?","Non si può annullare.","delPhotoOk","Elimina"); },
    delPhotoOk(){ const id=UI.delP; S.core.photos=S.core.photos.filter(p=>p.id!==id); ls.del("athleticos.ph."+id); delete PHOTO_MEM[id]; touch("core"); if(COL) COL.doc("p_"+id).delete().catch(()=>{}); closeSheet(); render(); },
    week(){ S.core.profile.week[+el.dataset.i]=v; touch("core"); render(); },
    exportSheet(){ S.core.lastBackup=Date.now(); touch("core"); const txt=JSON.stringify(S); openSheet(`<h2>Backup</h2>
      <button class="btn pri block" data-act="dlBackup">Scarica file di backup (con foto)</button>
      <p class="small muted" style="margin:0">Salvalo su Drive o mandalo a te stesso. In alternativa copia il testo qui sotto (senza foto).</p>
      <textarea id="expTx" readonly style="min-height:120px;font-size:12px">${esc(txt)}</textarea><button class="btn block" data-act="copyExp">Copia testo</button>`); },
    dlBackup(){ const photos={}; S.core.photos.forEach(p=>{ const v=PHOTO_MEM[p.id]||ls.get("athleticos.ph."+p.id); if(v) photos[p.id]=v; });
      const blob=new Blob([JSON.stringify({app:"athletic-os",v:1,at:new Date().toISOString(),data:S,photos})],{type:"application/json"});
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="athletic-os-backup-"+dk()+".json"; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000); toast("Backup scaricato"); },
    copyExp(){ const t=$("#expTx"); navigator.clipboard.writeText(t.value).then(()=>toast("Copiato"),()=>{ t.select(); toast("Seleziona e copia a mano"); }); },
    importSheet(){ openSheet(`<h2>Importa backup</h2><p class="small muted" style="margin:0">Scegli il file di backup oppure incolla il testo. I dati di questo telefono vengono sostituiti da quelli del backup.</p>
      <label class="btn block" for="impFile">Scegli file .json</label><input id="impFile" type="file" accept="application/json,.json" hidden>
      <textarea id="impTx" style="min-height:120px;font-size:12px" placeholder="…oppure incolla qui il testo copiato"></textarea><button class="btn pri block" data-act="doImport">Importa testo</button>`); },
    doImport(){ importBackup($("#impTx").value); },
    addFood(){ const f=FOODS[+v]; AI_ITEMS.push(foodItem(+v,f[5])); $("#aiOut").innerHTML=aiOutHtml(); const q=$("#foodQ"); if(q){ q.value=""; renderFoodRes(); } toast("Nel piatto: correggi i grammi se serve"); },
    addFavToPlate(){ const f=S.core.favs.find(x=>x.id===v); if(f){ AI_ITEMS.push({name:f.name,grams:0,kcal:f.kcal,p:f.p,c:f.c,f:f.f}); $("#aiOut").innerHTML=aiOutHtml(); } },
    install(){ if(!INSTALL_EVT) return; INSTALL_EVT.prompt(); INSTALL_EVT.userChoice.finally(()=>{ INSTALL_EVT=null; render(); }); },
    resetAll(){ confirmSheet("Cancellare tutto?","Elimino pesate, pasti, allenamenti e impostazioni. Fai prima un backup se ti servono.","resetOk","Cancella tutto"); },
    resetOk(){ const keepMonths=Object.keys(S.months); S=fresh(); S.core.u=Date.now(); keepMonths.forEach(m=>{ S.months[m]={u:Date.now(),days:{},workouts:[]}; S.core.monthKeys.push(m); dirty.add("m_"+m); }); touch("core"); closeSheet(); render(); }
  };
  if(H[a]){ e.preventDefault(); H[a](); }
});
function saveWeight(kg,d){
  if(!kg||kg<30||kg>250){ toast("Inserisci un peso valido"); return; }
  S.core.weights=S.core.weights.filter(w=>w.d!==d); S.core.weights.push({d,kg:Math.round(kg*10)/10}); touch("core"); render(); toast("Peso salvato");
}
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.in && S.core.active){ const s=S.core.active.ex[el.dataset.id][+el.dataset.j]; s[el.dataset.in]=el.value; touch("core"); }
  if(el.id==="foodQ") renderFoodRes();
  if(el.dataset.ai){ const it=AI_ITEMS[+el.dataset.i]; if(it){ it[el.dataset.ai]= el.dataset.ai==="name"? el.value : +el.value; } }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.pf){ const p=S.core.profile, f=el.dataset.pf; let val=el.value;
    if(["age","height","goal","basket","water","sleep","pace"].includes(f)) val=+val||p[f];
    if(["kcalOverride","protOverride"].includes(f)) val=val?+val:null;
    if(f==="name") val=val.trim()||"Mattia";
    p[f]=val; touch("core"); render(); }
  if(el.dataset.grams!=null){ const it=AI_ITEMS[+el.dataset.grams], g=+el.value; if(it&&g>0){ const base=it.grams||g; const k=g/base; ["kcal","p","c","f"].forEach(x=>it[x]=it[x]*k); it.grams=g; setTimeout(()=>{ const o=$("#aiOut"); if(o) o.innerHTML=aiOutHtml(); },0); } }
  if(el.id==="impFile"&&el.files[0]){ const r=new FileReader(); r.onload=()=>importBackup(String(r.result)); r.readAsText(el.files[0]); }
  if(el.dataset.habits){ S.core.habits=el.value.split("\n").map(s=>s.trim()).filter(Boolean).slice(0,10); touch("core"); }
  if(el.id==="aiPhoto" && el.files[0]){ shrink(el.files[0],1024,0.8).then(r=>{ AI_FILES=[r.blob]; $("#aiPhotoLbl").textContent="Foto pronta"; }).catch(()=>toast("Foto non leggibile")); }
  if(el.id==="photoIn" && el.files[0]){ shrink(el.files[0],720,0.72).then(r=>{ const id=uid(); PHOTO_MEM[id]=r.url; ls.set("athleticos.ph."+id,r.url); S.core.photos.push({id,d:dk()}); touch("core"); photoQueue.push(id); scheduleFlush(); render(); toast("Foto salvata"); }).catch(()=>toast("Foto non leggibile")); }
});
window.addEventListener("hashchange",()=>{ const t=location.hash.slice(1); if(t&&t!==UI.tab&&TABS.some(x=>x[0]===t)){ UI.tab=t; render(); } });

/* ---------- standalone: speech, backup, PWA ---------- */
let HAS_AI=false, PERSIST=null, INSTALL_EVT=null;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition||null;
let REC=null;
function webMic(){
  if(!SR){ toast("Dettatura non disponibile"); return; }
  if(REC){ try{REC.stop();}catch(e){} return; }
  REC=new SR(); REC.lang="it-IT"; REC.interimResults=false; REC.maxAlternatives=1;
  const b=$("#micBtn"); if(b) b.classList.add("pri");
  REC.onresult=ev=>{ const t=ev.results[0][0].transcript; const ta=$("#aiText"), q=$("#foodQ");
    if(q){ q.value=t; renderFoodRes(); } else if(ta){ ta.value=(ta.value?ta.value.trim()+" ":"")+t; } };
  REC.onerror=ev=>{ if(ev.error==="not-allowed") toast("Microfono non autorizzato"); };
  REC.onend=()=>{ REC=null; const b=$("#micBtn"); if(b) b.classList.remove("pri"); };
  try{ REC.start(); }catch(e){ REC=null; }
}
function importBackup(txt){
  try{
    let o=JSON.parse(txt), photos=null;
    if(o&&o.app==="athletic-os"){ photos=o.photos||{}; o=o.data; }
    if(!o||!o.core||!o.months) throw 0;
    const n=Object.values(o.months).reduce((a,m)=>a+Object.keys(m.days||{}).length,0);
    S=o; S.core.u=Date.now(); S.core.lastBackup=S.core.lastBackup||Date.now();
    if(photos) for(const id in photos){ PHOTO_MEM[id]=photos[id]; ls.set("athleticos.ph."+id,photos[id]); photoQueue.push(id); }
    for(const m in S.months){ S.months[m].u=Date.now(); dirty.add("m_"+m); }
    touch("core"); closeSheet(); render(); toast(`Backup importato: ${n} giorni, ${S.core.weights.length} pesate`);
  }catch(err){ toast("File o testo non valido"); }
}
function initPWA(){
  if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
  try{ if(navigator.storage&&navigator.storage.persist){ navigator.storage.persisted().then(p=> p?p:navigator.storage.persist()).then(p=>{ PERSIST=!!p; if(UI.tab==="profilo") render(); }).catch(()=>{}); } }catch(e){}
  window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); INSTALL_EVT=e; if(UI.tab==="profilo") render(); });
  window.addEventListener("appinstalled",()=>{ INSTALL_EVT=null; toast("Athletic OS installata"); });
}

/* ---------- cloud sync (claude db) ---------- */
let COL=null, SYNC="local", dirty=new Set(), photoQueue=[], flushT=null, flushing=false;
function syncText(){ return {local:"Dati salvati su questo telefono, anche offline.",loading:"Sincronizzazione in corso…",ok:"Dati salvati nel tuo account: li ritrovi su ogni dispositivo.",error:"Sincronizzazione non riuscita: i dati restano su questo telefono."}[SYNC]; }
function showSync(){ ["#syncLine","#syncLine2"].forEach(s=>{ const el=$(s); if(el) el.textContent=syncText(); }); }
async function rget(id){
  const r=await COL.doc(id).get(); if(r==null) return null;
  if(typeof r.data==="function"){ const ex=typeof r.exists==="function"?r.exists():r.exists; if(ex===false) return null; return r.data()||null; }
  if(r&&typeof r==="object"&&"data" in r&&r.data&&typeof r.data==="object"&&("u" in r.data||"img" in r.data)) return r.data;
  return r;
}
function scheduleFlush(){ if(!COL) return; clearTimeout(flushT); flushT=setTimeout(flush,1200); }
async function flush(){
  if(!COL||flushing) return; flushing=true;
  try{
    while(dirty.size){ const id=dirty.values().next().value; dirty.delete(id);
      const data= id==="core"? S.core : S.months[id.slice(2)]; if(!data) continue;
      await COL.doc(id).set(JSON.parse(JSON.stringify(data))); }
    while(photoQueue.length){ const id=photoQueue[0]; const img=PHOTO_MEM[id]||ls.get("athleticos.ph."+id); if(img) await COL.doc("p_"+id).set({u:Date.now(),img}); photoQueue.shift(); }
    if(SYNC!=="ok"){ SYNC="ok"; showSync(); }
  }catch(e){ SYNC="error"; showSync(); setTimeout(()=>{ flushing=false; scheduleFlush(); },15000); return; }
  flushing=false;
  if(dirty.size) scheduleFlush();
}
async function initCloud(){
  if(!window.claude||typeof window.claude.use!=="function") return;
  cap("sample").then(sm=>{ HAS_AI=!!sm; if(HAS_AI&&UI.tab==="cibo"&&!document.body.classList.contains("sheet")) render(); });
  claude.use("dictation").then(d=>{ if(!d) return; DICT=d;
    d.onFinal(({text})=>{ const t=$("#aiText"); if(t&&text){ t.value=(t.value?t.value.trim()+" ":"")+text; } });
    d.onState(({state})=>{ dictOn= state==="listening"; const b=$("#micBtn"); if(b) b.innerHTML= dictOn? `${IC.mic} Stop` : `${IC.mic} Detta`; });
    if(UI.tab==="cibo"&&!document.body.classList.contains("sheet")) render();
  }).catch(()=>{});
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    COL=db.collection("data/users/"+id); SYNC="loading"; showSync();
    const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),10000));
    const remoteCore=await Promise.race([rget("core"),timeout]);
    let changed=false;
    if(remoteCore&&remoteCore.u>S.core.u){ const act=S.core.active; S.core=remoteCore; if(!S.core.active&&act) S.core.active=act; changed=true; ls.set(LS,JSON.stringify(S)); }
    else dirty.add("core");
    const keys=new Set([...(S.core.monthKeys||[]),...Object.keys(S.months)]);
    for(const m of keys){ const r=await rget("m_"+m); if(r&&(!S.months[m]||r.u>S.months[m].u)){ S.months[m]=r; changed=true; } else if(S.months[m]) dirty.add("m_"+m); if(!S.core.monthKeys.includes(m)) S.core.monthKeys.push(m); }
    saveLocal();
    for(const ph of S.core.photos){ if(!PHOTO_MEM[ph.id]&&!ls.get("athleticos.ph."+ph.id)){ rget("p_"+ph.id).then(r=>{ if(r&&r.img){ PHOTO_MEM[ph.id]=r.img; const im=$("#ph_"+ph.id); if(im) im.src=r.img; } }).catch(()=>{}); } }
    SYNC="ok"; if(changed&&!document.body.classList.contains("sheet")&&!S.core.active) render(); showSync();
    flush();
  }catch(e){ SYNC= COL?"error":"local"; showSync(); }
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") flush(); });

render();
initPWA();
initCloud();
</script>
